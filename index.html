<style>
/* ניהול ועד - neutral blue/gray theme, mobile first */
:root {
  --bg: #f3f5f8;
  --card: #ffffff;
  --ink: #1c2733;
  --muted: #5b6b7c;
  --line: #dde3ea;
  --primary: #2563eb;
  --primary-soft: #e8f0fe;
  --navy: #1e3a5f;
  --pos: #15803d;
  --pos-soft: #e7f6ec;
  --neg: #c62828;
  --neg-soft: #fdecec;
  --warn: #b26a00;
  --warn-soft: #fff4e0;
  --wa: #1fa855;
  --radius: 14px;
  --shadow: 0 1px 3px rgba(20, 35, 55, .08);
  --tabbar-h: 68px;
  font-size: 17px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: Assistant, "Arial Hebrew", Arial, sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
body.modal-open { overflow: hidden; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
img { max-width: 100%; }
p { margin: .3em 0; }
small, .small { font-size: .84rem; }
.muted { color: var(--muted); }
.pos { color: var(--pos); }
.neg { color: var(--neg); }
.good-text { color: var(--pos); font-weight: 600; }
.info-text { color: var(--primary); }
.help { color: var(--muted); font-size: .86rem; margin: .3em 0 .6em; }
.req { color: var(--neg); }
.center-note { text-align: center; color: var(--muted); padding: 24px 0; }
.empty { text-align: center; color: var(--muted); padding: 32px 12px; }
.empty .ti { font-size: 2.6rem; opacity: .5; }

/* ---------- Login ---------- */
#login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px 16px; }
.login-box { width: 100%; max-width: 400px; background: var(--card); border-radius: 20px; padding: 28px 22px; box-shadow: 0 6px 30px rgba(20, 35, 55, .1); text-align: center; }
.login-box h1 { margin: 6px 0 0; font-size: 1.7rem; color: var(--navy); }
.login-logo { width: 72px; height: 72px; border-radius: 18px; }
.login-box form { text-align: right; margin-top: 14px; }
.login-box .btn { margin-top: 16px; }

/* ---------- Shell ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  background: var(--navy); color: #fff;
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
}
.topbar h1 { font-size: 1.2rem; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { background: rgba(255, 255, 255, .12); border: 0; color: #fff; width: 40px; height: 40px; border-radius: 12px; font-size: 1.3rem; display: inline-flex; align-items: center; justify-content: center; flex: none; }
main { max-width: 760px; margin: 0 auto; padding: 14px 16px calc(var(--tabbar-h) + 28px + env(safe-area-inset-bottom)); }
body.resident main { padding-bottom: 32px; }
#tabbar {
  position: fixed; bottom: 0; inset-inline: 0; z-index: 20;
  display: flex; background: #fff; border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
#tabbar button { flex: 1; height: var(--tabbar-h); border: 0; background: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: .8rem; font-weight: 600; }
#tabbar button .ti { font-size: 1.65rem; }
#tabbar button.on { color: var(--primary); }

/* ---------- Cards & layout ---------- */
.card { background: var(--card); border-radius: var(--radius); padding: 16px; margin: 0 0 14px; box-shadow: var(--shadow); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.card-title { font-weight: 700; font-size: 1.08rem; margin: 0 0 8px; display: flex; align-items: center; gap: 6px; }
.card-head .card-title { margin: 0; }
.big-title { font-size: 1.35rem; font-weight: 700; margin: 0; }
.section-title { font-weight: 700; color: var(--muted); margin: 18px 2px 8px; font-size: .95rem; }
.sub-title { font-weight: 700; margin: 16px 0 6px; }
.toolbar { display: flex; gap: 8px; align-items: center; justify-content: flex-end; margin-bottom: 10px; flex-wrap: wrap; }
.row-gap { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.btn-row .btn { margin: 0; }
.action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.action-grid .btn { margin: 0; }
.range-text { color: var(--muted); margin: 6px 2px 12px; }
.flash { animation: flash 1.4s ease; }
@keyframes flash { 0%, 60% { box-shadow: 0 0 0 3px var(--primary); } 100% { box-shadow: var(--shadow); } }

/* ---------- Forms ---------- */
label { display: block; font-weight: 600; font-size: .92rem; margin: 12px 0 4px; }
input, select, textarea {
  width: 100%; min-height: 46px; padding: 10px 12px;
  border: 1px solid var(--line); border-radius: 10px; background: #fff;
  font-size: 1rem; outline: none;
}
input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
select.compact { width: auto; min-height: 40px; padding: 6px 10px; }
label.check { display: flex; align-items: center; gap: 8px; font-weight: 500; margin: 14px 0 6px; }
label.check input { width: 22px; height: 22px; min-height: 0; flex: none; }
.form-card .btn { margin-top: 18px; }
.form-error { color: var(--neg); background: var(--neg-soft); padding: 8px 10px; border-radius: 8px; margin-top: 10px; font-weight: 600; }
.live-hint { background: var(--primary-soft); padding: 8px 10px; border-radius: 8px; }
.preview { background: var(--primary-soft); border-radius: 10px; padding: 10px 12px; margin-top: 10px; }
.pv-title { font-weight: 700; margin: 0 0 4px; }
.pv-foot { margin: 6px 0 0; font-weight: 600; }
.filter-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
.filter-bar input { grid-column: 1 / -1; }

/* ---------- Buttons ---------- */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  width: 100%; min-height: 50px; padding: 10px 16px; margin: 0 0 10px;
  border-radius: 12px; border: 1px solid var(--line); background: #fff;
  font-weight: 700; font-size: 1rem;
}
.btn:disabled { opacity: .55; cursor: default; }
.btn .ti { font-size: 1.25rem; }
.btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn.success { background: var(--pos); color: #fff; border-color: var(--pos); }
.btn.danger { background: var(--neg); color: #fff; border-color: var(--neg); }
.btn.whatsapp { background: var(--wa); color: #fff; border-color: var(--wa); }
.btn.ghost { background: transparent; }
.btn.danger-ghost { background: transparent; color: var(--neg); border-color: #f2c4c4; }
.btn.small { min-height: 40px; font-size: .92rem; padding: 6px 12px; width: auto; display: inline-flex; margin: 6px 0 0; }
.btn.back { width: auto; display: inline-flex; min-height: 40px; border: 0; padding: 4px 6px; color: var(--primary); margin-bottom: 6px; }
.chip-btn {
  display: inline-flex; align-items: center; gap: 4px;
  border: 1px solid var(--line); background: #fff; border-radius: 999px;
  padding: 6px 12px; font-size: .9rem; font-weight: 600; white-space: nowrap;
}
.chip-btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.chip-btn.danger { color: var(--neg); border-color: #f2c4c4; }
.icon-sm { border: 0; background: none; color: var(--muted); font-size: 1.15rem; padding: 4px 6px; border-radius: 8px; }
.icon-sm.danger { color: var(--neg); }
.link-title { border: 0; background: none; padding: 0; font-weight: 700; color: var(--primary); text-align: right; }

/* Segmented control / chips */
.seg { display: flex; background: #e9edf2; border-radius: 12px; padding: 4px; gap: 4px; margin: 12px 0; }
.seg button { flex: 1; border: 0; background: none; border-radius: 9px; padding: 9px 6px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.seg button.on { background: var(--primary); color: #fff; box-shadow: var(--shadow); }
.seg.small button { padding: 6px 4px; font-size: .9rem; }
.chip-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin: 6px 0; }
.chip-grid.wide { grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); }
.chip { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 9px 2px; font-weight: 600; font-size: .92rem; }
.chip.selected { background: var(--primary); border-color: var(--primary); color: #fff; }

/* ---------- Metrics & banners ---------- */
.metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.metric-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
.metric { background: var(--card); border-radius: var(--radius); padding: 12px; box-shadow: var(--shadow); border: 2px solid transparent; text-align: right; }
.card .metric { background: var(--bg); box-shadow: none; }
.metric .label { color: var(--muted); font-size: .85rem; margin: 0; display: flex; align-items: center; gap: 2px; }
.metric .value { font-size: 1.3rem; font-weight: 700; margin: 2px 0 0; white-space: nowrap; }
.metric.link { cursor: pointer; }
.metric.active { border-color: var(--primary); }
.banner { display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 14px; border-radius: 12px; margin: 0 0 14px; border: 0; text-align: right; font-weight: 600; }
.banner .ti { font-size: 1.4rem; flex: none; }
.banner span { flex: 1; }
.banner.warn { background: var(--warn-soft); color: var(--warn); }
.banner.bad { background: var(--neg-soft); color: var(--neg); }
.banner.good { background: var(--pos-soft); color: var(--pos); }
.banner.clickable { cursor: pointer; }

/* ---------- Lists ---------- */
.list-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); width: 100%; }
.list-row:last-child { border-bottom: 0; }
button.link-row { background: none; border: 0; border-bottom: 1px solid var(--line); text-align: right; }
.row-actions { display: inline-flex; gap: 6px; flex: none; }
.kv { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--line); }
.kv:last-child { border-bottom: 0; }
.kv span:first-child { color: var(--muted); }
.kv.total { font-weight: 700; font-size: 1.08rem; border-top: 2px solid var(--ink); border-bottom: 0; }
.kv-line { display: flex; justify-content: space-between; gap: 10px; margin: 6px 0; flex-wrap: wrap; }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; font-size: .82rem; font-weight: 700; background: #eef1f5; color: var(--muted); border: 0; white-space: nowrap; }
.badge.success { background: var(--pos-soft); color: var(--pos); }
.badge.warning { background: var(--warn-soft); color: var(--warn); }
.badge.danger { background: var(--neg-soft); color: var(--neg); }
.badge.info { background: var(--primary-soft); color: var(--primary); }
.badge.block { display: flex; justify-content: center; margin-top: 10px; padding: 8px; }
button.badge { cursor: pointer; }
.month-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.mchip { display: inline-flex; align-items: center; gap: 4px; background: var(--neg-soft); color: var(--neg); border-radius: 8px; padding: 4px 10px; font-size: .88rem; font-weight: 600; border: 0; }
.mchip.partial { background: var(--warn-soft); color: var(--warn); }
.mchip.paid { background: var(--pos-soft); color: var(--pos); }
button.mchip { background: #eef1f5; color: var(--ink); }
.tenant-group { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 8px 0; }
.tg-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 700; }
.progress { height: 10px; background: #e9edf2; border-radius: 99px; overflow: hidden; margin: 6px 0; }
.progress span { display: block; height: 100%; background: var(--primary); border-radius: 99px; }
.progress.near span { background: #eda100; }
.progress.over span { background: var(--neg); }
.budget-row { padding: 10px 0; border-bottom: 1px solid var(--line); }
.br-head { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; }

/* ---------- Units ---------- */
.unit-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
.unit-card { display: flex; flex-direction: column; align-items: stretch; gap: 3px; text-align: right; border: 1px solid rgba(0, 0, 0, .06); border-radius: var(--radius); padding: 12px; min-height: 108px; box-shadow: var(--shadow); }
.unit-card.turnover { border: 2px dashed #94a3b8; }
.unit-card .row-top { display: flex; justify-content: space-between; align-items: center; }
.unit-card .num { font-weight: 700; color: var(--muted); font-size: .88rem; }
.unit-card .name { font-weight: 700; font-size: 1.05rem; }
.dot { width: 11px; height: 11px; border-radius: 50%; background: #cbd5e1; }
.dot.paid { background: var(--pos); }
.dot.late { background: var(--neg); }
.status-text { font-weight: 700; font-size: .92rem; margin: 0; }
.status-text.paid { color: var(--pos); }
.status-text.late { color: var(--neg); }
.status-text.vacant { color: var(--muted); }
.prev-debt { font-size: .8rem; color: var(--warn); font-weight: 600; }
.turnover-tag { font-size: .78rem; color: var(--muted); }
.access-grid, .pay-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 8px 0 12px; }
.access-cell, .pay-cell { display: flex; flex-direction: column; align-items: center; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 2px; }
.access-cell small, .pay-cell small { font-size: .74rem; color: var(--muted); }
.access-cell.on, .pay-cell.full { background: var(--pos-soft); border-color: #b9e2c6; }
.access-cell.old, .pay-cell.part { background: var(--warn-soft); border-color: #f1d49c; }
.sig-thumb { height: 44px; background: #fff; border: 1px solid var(--line); border-radius: 6px; }

/* ---------- Transactions ---------- */
.tx-card { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 8px 0; background: #fff; }
.tx-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.tx-title { font-weight: 700; }
.tx-amt { font-weight: 700; white-space: nowrap; }
.tx-sub { color: var(--muted); font-size: .86rem; }
.tx-rows { margin-top: 6px; border-top: 1px dashed var(--line); padding-top: 4px; }
.tx-row { display: flex; justify-content: space-between; gap: 10px; font-size: .9rem; padding: 2px 0; }
.tx-note { font-size: .86rem; color: var(--muted); margin-top: 4px; }
.tx-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

/* ---------- Projects ---------- */
details.project > summary { list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; cursor: pointer; }
details.project > summary::-webkit-details-marker { display: none; }
details.project > summary::after { content: "▾"; color: var(--muted); }
details.project[open] > summary::after { content: "▴"; }
.p-title { font-weight: 700; font-size: 1.1rem; flex: 1; }
.quote { border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; margin: 8px 0; }
.quote.chosen { border-color: var(--pos); background: #f6fcf8; }
.q-head { display: flex; align-items: center; gap: 6px; }
.q-head .row-actions { margin-inline-start: auto; }
.q-item { display: flex; justify-content: space-between; width: 100%; border: 0; border-bottom: 1px dashed var(--line); background: none; padding: 7px 0; text-align: right; gap: 8px; }
.q-item .ti { color: var(--muted); font-size: .95rem; }
.q-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 6px; flex-wrap: wrap; }

/* ---------- Receipt ---------- */
.receipt { background: #fff; border-radius: var(--radius); padding: 22px 18px; box-shadow: var(--shadow); margin-bottom: 14px; }
.r-name { text-align: center; font-size: 1.45rem; font-weight: 700; margin: 0; }
.r-addr { text-align: center; color: var(--muted); margin: 0; }
.r-num { text-align: center; color: var(--primary); font-weight: 700; margin: 4px 0 12px; padding-bottom: 12px; border-bottom: 2px dashed var(--line); }
.r-fields div { display: flex; justify-content: space-between; padding: 4px 0; }
.r-fields span { color: var(--muted); }
.r-lines { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 8px; }
.r-lines .tx-row { font-size: 1rem; }
.r-total { display: flex; justify-content: space-between; font-weight: 700; font-size: 1.15rem; border-top: 2px solid var(--ink); margin-top: 8px; padding-top: 8px; }
.r-thanks { text-align: center; margin: 16px 0 6px; font-size: 1.05rem; }
.r-sig { display: block; margin: 6px auto 0; max-height: 80px; }

/* ---------- Charts ---------- */
.chart-box { position: relative; height: 230px; margin: 8px 0; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .88rem; }
.legend-item { display: inline-flex; align-items: center; gap: 5px; }
.sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

/* ---------- Modal ---------- */
.modal-overlay { position: fixed; inset: 0; z-index: 100; background: rgba(15, 25, 40, .45); display: flex; align-items: flex-end; justify-content: center; opacity: 0; transition: opacity .2s; }
.modal-overlay.show { opacity: 1; }
.modal { background: #fff; width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); transform: translateY(30px); transition: transform .2s; }
.modal.wide { max-width: 640px; }
.modal-overlay.show .modal { transform: none; }
.modal-title { margin: 0 0 6px; font-size: 1.2rem; }
.modal-msg { margin: 8px 0 16px; }
.modal-body .form-row:first-child label { margin-top: 4px; }
.modal-actions { display: flex; flex-direction: column; gap: 0; margin-top: 16px; }
.modal-actions .btn { margin-bottom: 8px; }
.sig-box { border: 2px dashed var(--line); border-radius: 12px; background: #fafbfc; }
.sig-box canvas { width: 100%; height: auto; display: block; }
@media (min-width: 700px) {
  .modal-overlay { align-items: center; }
  .modal { border-radius: 20px; }
}

/* ---------- Toast & spinner ---------- */
#toast-root { position: fixed; z-index: 200; inset-inline: 0; bottom: calc(var(--tabbar-h) + 16px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; padding: 0 16px; }
.toast { display: flex; align-items: center; gap: 8px; max-width: 480px; background: var(--ink); color: #fff; padding: 11px 16px; border-radius: 12px; font-weight: 600; box-shadow: 0 6px 20px rgba(0, 0, 0, .2); opacity: 0; transform: translateY(10px); transition: all .25s; }
.toast.show { opacity: 1; transform: none; }
.toast.ok .ti { color: #6ee7a0; }
.toast.err { background: var(--neg); }
.toast.info { background: var(--navy); }
.spinner { width: 18px; height: 18px; border: 2.5px solid rgba(128, 128, 128, .3); border-top-color: currentColor; border-radius: 50%; display: inline-block; animation: spin .8s linear infinite; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Larger screens ---------- */
@media (min-width: 620px) {
  .unit-grid { grid-template-columns: repeat(3, 1fr); }
  .access-grid, .pay-grid { grid-template-columns: repeat(6, 1fr); }
}
@media (max-width: 380px) {
  :root { font-size: 16px; }
  .metric .value { font-size: 1.1rem; }
  .chip-grid { grid-template-columns: repeat(4, 1fr); }
}
.action-grid .chip-btn { justify-content: center; padding: 10px 8px; border-radius: 12px; font-size: .95rem; }

</style>
</head>

      <div class="month-chips">${r.openMonths.map((m) => `<span class="mchip ${m.paid > 0 ? "partial" : ""}">${esc(m.label)} · ${fmtILS(m.owed)}${m.paid > 0 ? ` (שולם ${fmtILS(m.paid)})` : ""}</span>`).join("")}</div>
      <p class="help">דמי ועד חודשיים: ${fmtILS(r.fee)}</p>
    </div>` : ""}

    ${(r.prepaid || []).length ? `<div class="card"><p class="card-title">שולם מראש</p>
      <div class="month-chips">${r.prepaid.map((m) => `<span class="mchip paid">${esc(m.label)} · ${fmtILS(m.paid)}</span>`).join("")}</div></div>` : ""}

    ${cultureOpen.length ? `<div class="card"><p class="card-title">תרבות הדיור</p>
      ${cultureOpen.map((y) => `<div class="kv"><span>שנת ${esc(y.year)}</span><b class="neg">נותר ${fmtILS(y.owed)}</b></div>`).join("")}</div>` : ""}

    <div class="card">
      <p class="card-title">התשלומים שלי</p>
      ${(r.payments || []).length ? r.payments.map((p) => `<div class="tx-card">
        <div class="tx-head"><span class="tx-title">${fmtDate(p.date)}${p.method ? ` · ${esc(p.method)}` : ""}</span><span class="tx-amt pos">${fmtILS(p.amount)}</span></div>
        ${(p.lines || []).length ? `<div class="tx-rows">${p.lines.map((l) => `<div class="tx-row"><span>${esc(l.text)}</span><span>${fmtILS(l.amount)}</span></div>`).join("")}</div>` : ""}
      </div>`).join("") : `<p class="muted">אין תשלומים רשומים</p>`}
    </div>

    <div class="card">
      <p class="card-title">מצב הבניין · ${esc(by.year)}</p>
      <div class="metric-grid cols-3">
        <div class="metric"><p class="label">הכנסות</p><p class="value pos">${fmtILS(by.income)}</p></div>
        <div class="metric"><p class="label">הוצאות</p><p class="value neg">${fmtILS(by.expense)}</p></div>
        <div class="metric"><p class="label">יתרת קופה</p><p class="value">${fmtILS(r.balance)}</p></div>
      </div>
      ${cats.length ? `<p class="section-title">התפלגות הוצאות</p><div class="chart-box"><canvas id="res-chart"></canvas></div>
        <div class="legend">${legendHtml(cats.map((c) => c[0]), cats.map((c) => c[1]), fmtILS)}</div>` : ""}
      ${r.updatedAt ? `<p class="help">עודכן: ${fmtDate(r.updatedAt)}</p>` : ""}
    </div>
    <button class="btn ghost" id="res-logout"><i class="ti ti-logout"></i> יציאה</button>`;
  if (cats.length) doughnut(main.querySelector("#res-chart"), cats.map((c) => c[0]), cats.map((c) => c[1]));
  main.querySelector("#res-logout").onclick = () => logout();
}

// app.js
var ROUTES = {
  dashboard: [renderDashboard, null, "dashboard", true],
  debtors: [renderDebtors, "חובות פתוחים", "dashboard", true],
  units: [renderUnits, "דירות", "units", true],
  unit: [renderUnit, "פרטי דירה", "units", true],
  income: [renderIncome, "הכנסה חדשה", "dashboard", false],
  expense: [renderExpense, "הוצאה חדשה", "dashboard", false],
  receipt: [renderReceipt, "קבלה", "dashboard", false],
  reports: [renderReports, "דוחות", "reports", true],
  projects: [renderProjects, "פרויקטים", "projects", true],
  settings: [renderSettings, "הגדרות", "settings", true]
};
var TABS = [
  ["dashboard", "ti-home", "בית"],
  ["units", "ti-building", "דירות"],
  ["reports", "ti-chart-pie", "דוחות"],
  ["projects", "ti-clipboard-list", "פרויקטים"],
  ["settings", "ti-settings", "הגדרות"]
];
var current = { name: "dashboard", params: {} };
function go(name, params = {}) {
  if (!ROUTES[name]) name = "dashboard";
  const same = current.name === name;
  current = { name, params };
  render();
  if (!same) window.scrollTo(0, 0);
}
function render() {
  const main = $("main");
  const [fn, title, tab] = ROUTES[current.name];
  $("page-title").textContent = title || S.settings.name || "ניהול ועד";
  document.querySelectorAll("#tabbar button").forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
  try {
    const r = fn(main, current.params, go);
    if (r && r.catch) r.catch((e) => {
      console.error(e);
      toast(errMsg(e), "err");
    });
  } catch (e) {
    console.error(e);
    main.innerHTML = `<div class="card"><p class="neg">שגיאה בהצגת המסך</p><p class="small muted">${esc(e.message)}</p></div>`;
  }
}
var liveRefresh = debounce(() => {
  if (S.role !== "admin" || !ROUTES[current.name][3] || isModalOpen()) return;
  const a = document.activeElement;
  if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && $("main").contains(a)) return;
  const y = window.scrollY;
  render();
  window.scrollTo(0, y);
}, 250);
function showApp() {
  $("login").hidden = true;
  $("app").hidden = false;
  document.body.classList.toggle("resident", S.role === "resident");
  if (S.role === "resident") {
    $("tabbar").hidden = true;
    $("page-title").textContent = S.resident.building.name || "ניהול ועד";
    renderResident($("main"));
    return;
  }
  $("tabbar").innerHTML = TABS.map(([t, ic, l]) => `<button data-tab="${t}"><i class="ti ${ic}"></i><span>${l}</span></button>`).join("");
  $("tabbar").querySelectorAll("button").forEach((b) => b.onclick = () => go(b.dataset.tab));
  onChange(liveRefresh);
  go("dashboard");
  preloadPdf();
}
function setupLogin() {
  const tabs = document.querySelectorAll("#login-tabs button");
  tabs.forEach((b) => b.onclick = () => {
    tabs.forEach((x) => x.classList.toggle("on", x === b));
    $("form-admin").hidden = b.dataset.t !== "admin";
    $("form-resident").hidden = b.dataset.t !== "resident";
    $("login-error").hidden = true;
  });
  const showErr = (e) => {
    const el = $("login-error");
    el.textContent = errMsg(e);
    el.hidden = false;
  };
  const submitting = (form, on) => {
    const btn = form.querySelector("button[type=submit]");
    btn.disabled = on;
    btn.innerHTML = on ? `<span class="spinner"></span> מתחבר...` : btn.dataset.label;
  };
  document.querySelectorAll("#login form").forEach((f) => {
    const b = f.querySelector("button[type=submit]");
    b.dataset.label = b.innerHTML;
  });
  $("form-admin").onsubmit = async (e) => {
    e.preventDefault();
    $("login-error").hidden = true;
    submitting(e.target, true);
    try {
      await adminLogin($("a-email").value, $("a-pass").value);
      showApp();
    } catch (err) {
      showErr(err);
    } finally {
      submitting(e.target, false);
    }
  };
  $("form-resident").onsubmit = async (e) => {
    e.preventDefault();
    $("login-error").hidden = true;
    submitting(e.target, true);
    try {
      await residentLogin($("r-unit").value, $("r-pin").value);
      showApp();
    } catch (err) {
      showErr(err);
    } finally {
      submitting(e.target, false);
    }
  };
  $("logout").onclick = () => logout();
}
setErrorHandler((e) => {
  console.error(e);
  toast(errMsg(e), "err");
});
window.addEventListener("unhandledrejection", (e) => console.error("unhandled", e.reason));
setupLogin();
if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => r.unregister())).catch(() => {
});

</script>
